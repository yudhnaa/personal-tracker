services:
  app:
    image: ghcr.io/yudhnaa/personal-tracker:latest
    container_name: personal-tracker-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - default
      - homelab

  postgres:
    image: postgres:17-alpine
    container_name: personal-tracker-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: personal_tracker
      POSTGRES_USER: ${POSTGRES_USER:-tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracker}
    volumes:
      - postgres-data-prod:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tracker} -d personal_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10


  redis:
    image: redis:7-alpine
    container_name: personal-tracker-redis-prod
    restart: unless-stopped
    volumes:
      - redis-data-prod:/data


volumes:
  postgres-data-prod:
  redis-data-prod:

networks:

  homelab:
    external: true
