name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Converts repository name to lowercase for Docker image name
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Lint
        run: npm run lint

      - name: Run Regression Tests
        run: npm run test:api-client && npm run test:subscriptions

      - name: Run Production Build
        env:
          NEXT_PUBLIC_API_GATEWAY_URL: http://localhost:8080
        run: npm run build

  build-and-push:
    name: Build & Push Docker Image
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    # Only push image if changes are merged to main, or manually triggered
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'))
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Validate production Gateway origin
        shell: bash
        env:
          NEXT_PUBLIC_API_GATEWAY_URL: ${{ vars.NEXT_PUBLIC_API_GATEWAY_URL }}
        run: |
          set -euo pipefail
          if [[ -z "$NEXT_PUBLIC_API_GATEWAY_URL" ]]; then
            echo "::error::NEXT_PUBLIC_API_GATEWAY_URL repository variable is required"
            exit 1
          fi
          if [[ "$NEXT_PUBLIC_API_GATEWAY_URL" != https://* ]]; then
            echo "::error::NEXT_PUBLIC_API_GATEWAY_URL must use HTTPS for production"
            exit 1
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_API_GATEWAY_URL=${{ vars.NEXT_PUBLIC_API_GATEWAY_URL }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to Production
    needs: build-and-push
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'))

    steps:
      - name: Resolve DDNS hostname to IPv4
        id: resolve-server
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_IP }}
        run: |
          set -euo pipefail
          echo "Resolving hostname: $SERVER_HOST"
          if ! RESOLVED_IP="$(
            getent ahostsv4 "$SERVER_HOST" |
            awk 'NR == 1 { print $1 }'
          )"; then
            echo "::error::Unable to resolve $SERVER_HOST to IPv4"
            exit 1
          fi

          if [ -z "$RESOLVED_IP" ]; then
            echo "::error::DNS returned no IPv4 address for $SERVER_HOST"
            exit 1
          fi

          echo "Resolved IPv4: $RESOLVED_IP"
          echo "ip=$RESOLVED_IP" >> "$GITHUB_OUTPUT"

      - name: Test SSH port
        shell: bash
        env:
          SERVER_IP: ${{ steps.resolve-server.outputs.ip }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -euo pipefail
          echo "Testing $SERVER_IP:$SERVER_PORT"
          if ! timeout 10 bash -c \
            "cat < /dev/null > /dev/tcp/$SERVER_IP/$SERVER_PORT"; then
            echo "::error::Unable to connect to $SERVER_IP:$SERVER_PORT"
            exit 1
          fi
          echo "SSH port is reachable"

      - name: Execute SSH commands on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.resolve-server.outputs.ip }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          timeout: 30s
          command_timeout: 10m
          script: |
            set -e
            echo "${{ secrets.PAT_TOKEN }}" \
              | docker login ${{ env.REGISTRY }} \
                  -u "${{ github.actor }}" \
                  --password-stdin
            cd "${{ secrets.SERVER_PROJECT_PATH }}"

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
